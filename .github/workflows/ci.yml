name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest tests/
      # Ignore list and the reason for each entry: .github/pip-audit-ignore.txt
      - run: python scripts/run_pip_audit.py
      - run: python scripts/run_pip_audit.py --format cyclonedx-json -o sbom.json
      - uses: actions/upload-artifact@v5
        with:
          name: sbom
          path: sbom.json
